<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="brand/favicon.ico"><link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invite · KAIROS</title>
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="home.css?v=202611181900">
<style>
  .hero { min-height: 100vh; display: flex; flex-direction: column; }
  .box { margin-block: auto; padding-block: 40px 80px; max-width: 560px; display: grid; gap: 18px; }
  .box h1 { font-size: clamp(34px, 6vw, 60px); }
  .box p { margin: 0; color: #c9cfdc; font-size: 17px; line-height: 1.5; }
  .show { font-weight: 600; color: #fff; }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <nav class="nav"><a class="brand" href="./"><img class="wordmark-img" src="brand/wordmark.svg?v=202611050530" alt="KAIROS"></a></nav>
  </div>
  <div class="wrap box">
    <h1 id="h">Loading…</h1>
    <p id="msg"></p>
    <div class="actions" id="act"></div>
  </div>
</header>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>window.KSYNC_MODE = "landing";</script>
<script src="sync.js?v=202611181900"></script>
<script>
(() => {
  const S = window.KSYNC, $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const t = new URLSearchParams(location.search).get("t") || "";

  const show = (h, msg, act = "") => { $("#h").textContent = h; $("#msg").innerHTML = msg; $("#act").innerHTML = act; };
  const signinBtn = `<button class="btn primary" data-signin>Sign in with Google</button>`;

  if (!/^[a-z0-9]{10,40}$/.test(t)) { show("This link is incomplete", "The invite link was cut off. Ask whoever sent it for a new one.", `<a class="btn" href="./">Go to KAIROS</a>`); return; }
  if (!S || !S.ready) { show("Can’t connect", "Check your internet connection and reload the page."); return; }

  async function run() {
    if (!S.user) { show("You’re invited to KAIROS", "Sign in with Google to see the invite.", signinBtn); return; }
    show("Checking the invite…", "");
    let inv = null;
    try { inv = await S.getInvite(t); } catch (e) { inv = null; }
    if (!inv) { show("This invite doesn’t exist", "The link was copied wrong or was deleted. Ask for a new one.", `<a class="btn" href="./">Go to KAIROS</a>`); return; }
    if (!inv.active || inv.expiresAt < Date.now()) { show("This invite has expired", "The link is no longer valid. Ask whoever sent it for a new one.", `<a class="btn" href="./">Go to KAIROS</a>`); return; }
    show("You’re invited to edit",
      `<span class="show">${esc(inv.showTitle || "a rundown")}</span>, from ${esc(inv.createdBy)}.${inv.team ? " You’ll also be able to start new rundowns." : ""}<br><br>You’re joining as <b>${esc(S.user.email)}</b>.`,
      `<button class="btn primary" id="accept">Accept the invite</button><button class="btn ghost" id="other">Use another account</button>`);
    $("#accept").onclick = async () => {
      $("#accept").disabled = true;
      try { const id = await S.acceptInvite(t); location.href = `rundown.html?id=${encodeURIComponent(id)}`; }
      catch (e) { $("#accept").disabled = false; show("That didn’t work", "We couldn’t add you to the team. The invite may have expired or been disabled. Ask for a new link.", `<a class="btn" href="./">Go to KAIROS</a>`); console.error(e); }
    };
    $("#other").onclick = () => S.signOut();
  }
  document.addEventListener("click", async (e) => { if (e.target.closest("[data-signin]")) { try { await S.signIn(); } catch (err) {} } });
  S.on("auth", run);
})();
</script>
</body>
</html>
